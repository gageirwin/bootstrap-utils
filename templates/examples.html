{% extends "global.html" %}

{% block title %}datetime{% endblock %}
{% block css %}{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/utils/DateTimeInput.js') }}"></script>
<script src="{{ url_for('static', filename='js/utils/FormValidation.js') }}"></script>


<script src="{{ url_for('static', filename='js/examples.js') }}"></script>
{% endblock %}


{% block content %}
<div class="container my-3">
    <div class="card mb-3">
        <div class="card-header">
            DateTimeInput Class
        </div>
        <div class="card-body">
            <div class="row gy-3 justify-content-center">


                <div class="input-group col-auto">
                    <span class="input-group-text"></span>
                    <input type="time" class="form-control">

                </div>
                <div class="input-group col-auto">
                    <span class="input-group-text"></span>
                    <input type="date" class="form-control">

                </div>
                <div class="input-group col-auto">
                    <span class="input-group-text"></span>
                    <input type="datetime-local" class="form-control">

                </div>

                <div class="w-100">
                    <hr>
                </div>

                <div class="input-group col-auto">
                    <span class="input-group-text"></span>
                    <input id="input-time" type="time" class="form-control">

                </div>
                <div class="input-group col-auto">
                    <span class="input-group-text"></span>
                    <input id="input-date" type="date" class="form-control">

                </div>
                <div class="input-group col-auto">
                    <span class="input-group-text"></span>
                    <input id="input-datetime" type="datetime-local" class="form-control">
                </div>


            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h4>Form Test</h4>
        </div>
        <div class="card-body">
            <form id="example-form" class="row g-3" novalidate>
                <div class="col-md-6">
                    <label for="inputEmail4" class="form-label">Email</label>
                    <input type="email" class="form-control" id="inputEmail4" required>
                    <div class="valid-feedback">
                        Looks good!
                    </div>
                    <div class="invalid-feedback">
                        Invalid Email.
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="inputPassword4" class="form-label">Password</label>
                    <input type="password" class="form-control" id="inputPassword4">
                </div>
                <div class="col-12">
                    <label for="inputAddress" class="form-label">Address</label>
                    <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St">
                </div>
                <div class="col-12">
                    <label for="inputAddress2" class="form-label">Address 2</label>
                    <input type="text" class="form-control" id="inputAddress2"
                        placeholder="Apartment, studio, or floor">
                </div>
                <div class="col-md-6">
                    <label for="inputCity" class="form-label">City</label>
                    <input type="text" class="form-control" id="inputCity">
                </div>
                <div class="col-md-4">
                    <label for="inputState" class="form-label">State</label>
                    <select id="inputState" class="form-select">
                        <option value="" selected>Choose...</option>
                        <option value="1">Option 1</option>
                        <option value="2">Option 2</option>
                        <option value="3">Option 3</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="inputZip" class="form-label">Zip</label>
                    <input type="text" class="form-control" id="inputZip" disabled>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="gridCheck" required>
                        <label class="form-check-label" for="gridCheck">
                            Check me out
                        </label>
                    </div>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Submit</button>
                    <button id="form-clear" type="button" class="btn btn-danger">Clear</button>
                </div>
            </form>

        </div>
    </div>

</div>
{% endblock %}
